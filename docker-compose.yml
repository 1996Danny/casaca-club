services:
  web:
    build: .
    image: casaca-club-app:latest
    container_name: casaca-club-app
    restart: unless-stopped
    depends_on:
      - api
    ports:
      # Publicado SOLO en localhost del VPS (127.0.0.1), nunca en 0.0.0.0:
      # así ninguna otra app ni el mundo exterior puede llegar directo a
      # este contenedor, salteando el reverse proxy que atienda
      # casacaclub.shop con HTTPS. Ver DEPLOY.md.
      - "127.0.0.1:${HOST_PORT:-8082}:80"
    environment:
      # Dominio(s) que atiende nginx. Con "localhost" también responde por la IP del VPS
      NGINX_HOST: ${NGINX_HOST:-localhost}

  # API de Mercado Pago: crea las preferencias de pago del carrito.
  # Sin "ports": no se publica en el host, sólo es alcanzable desde "web"
  # a través de la red interna de este docker-compose (proxy /api/ en
  # nginx.conf), así el MP_ACCESS_TOKEN nunca queda expuesto afuera.
  api:
    build:
      context: .
      dockerfile: server/Dockerfile
    image: casaca-club-app-api:latest
    container_name: casaca-club-app-api
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      MP_ACCESS_TOKEN: ${MP_ACCESS_TOKEN}
      SITE_URL: ${SITE_URL:-http://localhost}
