server {
    listen 80;
    # Plantilla: ${NGINX_HOST} se toma de la variable de entorno (ver .env)
    server_name ${NGINX_HOST};

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # Cabeceras de seguridad básicas (se heredan en las locaciones que no definen add_header)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Compresión
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # Archivos con hash generados por Vite: cache de larga duración
    location /assets/ {
        expires 1y;
        access_log off;
        try_files $uri =404;
    }

    # API de Mercado Pago: proxy al servicio "api" (sin publicar en el
    # host, sólo alcanzable dentro de la red de docker-compose).
    location /api/ {
        proxy_pass http://api:3000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Endpoint de salud para el healthcheck del contenedor
    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # SPA: rutas de react-router (BrowserRouter) caen en index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
